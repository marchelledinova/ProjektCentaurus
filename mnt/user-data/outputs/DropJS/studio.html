<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DropJS Studio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="studio.css">
</head>
<body>

  <noscript><p style="padding:1rem">DropJS Studio needs JavaScript.</p></noscript>

  <div class="studio">

    <!-- Top bar -->
    <header class="topbar">
      <a class="logo" href="index.html" title="Back to the website">
        <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-icon="logo"></svg>
        DropJS Studio
      </a>
      <input class="project-name" id="project-name" value="Untitled project" maxlength="40" aria-label="Project name">

      <div class="toolbar">
        <button class="icon-btn" id="btn-open" type="button" title="Open saved project" aria-label="Open saved project"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-icon="folder"></svg></button>
        <button class="icon-btn" id="btn-new" type="button" title="New project" aria-label="New project"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-icon="plus"></svg></button>
        <button class="icon-btn" id="btn-save" type="button" title="Save project" aria-label="Save project"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-icon="save"></svg></button>
        <button class="icon-btn" id="btn-undo" type="button" title="Undo" aria-label="Undo" disabled><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-icon="undo"></svg></button>
        <button class="icon-btn" id="btn-redo" type="button" title="Redo" aria-label="Redo" disabled><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-icon="redo"></svg></button>
        <button class="pill pill--outline" id="btn-preview" type="button"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-icon="eye"></svg><span>Preview</span></button>
        <button class="pill pill--solid" id="btn-generate" type="button"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-icon="code"></svg>Generate</button>
      </div>
    </header>

    <div class="workspace">

      <!-- Left: components and tree -->
      <aside class="sidebar">
        <div class="tabs" role="tablist">
          <button class="tab" id="tab-comp" type="button" role="tab" aria-selected="true" aria-controls="panel-comp"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-icon="grid"></svg>Components</button>
          <button class="tab" id="tab-tree" type="button" role="tab" aria-selected="false" aria-controls="panel-tree"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-icon="tree"></svg>Tree</button>
        </div>

        <div class="panel-body" id="panel-comp" role="tabpanel" aria-labelledby="tab-comp">
          <h2 class="panel-title">Components</h2>
          <div id="comp-list"></div>
        </div>

        <div class="panel-body" id="panel-tree" role="tabpanel" aria-labelledby="tab-tree" hidden>
          <h2 class="panel-title">Widget tree</h2>
          <div id="tree"></div>
        </div>
      </aside>

      <!-- Middle: canvas -->
      <main class="canvas" id="canvas">
        <div class="device">
          <div class="frame">
            <h1 class="frame-title" id="frame-title"></h1>
            <div class="nodes" id="nodes"></div>
            <div class="dropzone" id="dropzone"><span id="dropzone-text"></span></div>
          </div>
        </div>
      </main>

      <!-- Right: properties -->
      <aside class="props">
        <h2 class="panel-title">Properties</h2>
        <div id="props"></div>
      </aside>

    </div>
  </div>

  <dialog id="gen-dialog" aria-labelledby="gen-title">
    <div class="dlg-bar">
      <h2 id="gen-title">Generated code</h2>
      <div>
        <button class="pill pill--solid" id="gen-copy" type="button">Copy</button>
        <button class="icon-btn" id="gen-close" type="button" aria-label="Close"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" data-icon="close"></svg></button>
      </div>
    </div>
    <pre><code id="gen-code"></code></pre>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="dropjs.js"></script>
  <script>
  (function () {
    "use strict";

    // Friendly hint if the sibling files were not found
    const studioEl = document.querySelector(".studio");
    const cssLoaded = getComputedStyle(studioEl).display === "grid" || window.innerWidth <= 860;
    if (typeof DropJS === "undefined" || !cssLoaded) {
      document.body.insertAdjacentHTML("afterbegin",
        '<p style="padding:1rem;margin:0;font:16px sans-serif;background:#fff3b0">' +
        "style.css, studio.css or dropjs.js was not found. Keep studio.html, style.css, studio.css and dropjs.js in the same folder, " +
        "or open standalone/studio.html, which needs nothing else.</p>");
      if (typeof DropJS === "undefined") return;
    }

    const $ = (selector, root) => (root || document).querySelector(selector);
    const $$ = (selector, root) => Array.from((root || document).querySelectorAll(selector));

    /* ------------------------------------------------------
       Icons (simple strokes that inherit the text colour)
       ------------------------------------------------------ */
    const ICONS = {
      logo: '<path d="M12 3l9 5-9 5-9-5z" fill="currentColor"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/>',
      folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      plus: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/>',
      save: '<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',
      undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
      redo: '<path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>',
      eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
      edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
      code: '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/>',
      close: '<path d="M6 6l12 12M18 6L6 18"/>',
      trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
      grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
      tree: '<rect x="3" y="3" width="7" height="5" rx="1"/><rect x="14" y="9.5" width="7" height="5" rx="1"/><rect x="14" y="17" width="7" height="4" rx="1"/><path d="M6.5 8v10h7.5M6.5 12h7.5"/>',
      menu: '<path d="M4 7h16M4 12h16M4 17h10"/>',
      nav: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
      user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>',
      select: '<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M14.5 11.5l2 2 2-2"/>',
      search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
      grip: '<g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></g>'
    };

    function icon(name, extraClass) {
      return '<svg class="i ' + (extraClass || "") + '" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + "</svg>";
    }

    $$("[data-icon]").forEach((el) => { el.innerHTML = ICONS[el.dataset.icon]; });

    /* ------------------------------------------------------
       Component types and default settings
       ------------------------------------------------------ */
    const COUNTRIES = [
      "Argentina", "Australia", "Brazil", "Canada", "Chile", "Egypt", "France",
      "Germany", "India", "Indonesia", "Japan", "Kenya", "Mexico", "Netherlands",
      "New Zealand", "Nigeria", "Norway", "Portugal", "South Korea", "Spain",
      "Sweden", "Thailand", "Vietnam"
    ].join("\n");

    const DEFAULTS = {
      label: "Menu", options: "", searchable: false, selectable: false, align: "left",
      ghost: false, wide: false, avatar: false,
      accent: "#2de2b0", bg: "#121a18", text: "#e6efec", radius: 10
    };

    const TYPES = {
      menu: { name: "Menu", icon: "menu", config: { label: "Menu", options: "Home\nSettings\nProfile" } },
      navigation: { name: "Navigation", icon: "nav", config: { label: "Explore", ghost: true, options: "Quick start\nSearchable\nCustomization\n---\nBack to top" } },
      profile: { name: "Profile menu", icon: "user", config: { label: "Account menu", avatar: true, ghost: true, align: "right", options: "View profile\nAccount settings\nBilling\n---\nSign out" } },
      select: { name: "Select", icon: "select", config: { label: "Sort by", selectable: true, wide: true, options: "Newest\nOldest\nMost popular\nA to Z" } },
      searchable: { name: "Searchable", icon: "search", config: { label: "Choose a country", searchable: true, wide: true, options: COUNTRIES } }
    };

    const AVATAR_HTML = '<span class="avatar">SR</span><span class="profile-name">Sam Rivera</span>';

    /* ------------------------------------------------------
       State
       ------------------------------------------------------ */
    const state = { nodes: [], selected: null };
    let instances = {};  // id -> DropJS
    let idCounter = 0;

    const nameInput = $("#project-name");
    const nodesEl = $("#nodes");
    const dropzone = $("#dropzone");
    const canvas = $("#canvas");
    const treeEl = $("#tree");
    const propsEl = $("#props");

    function current() {
      return state.nodes.find((n) => n.id === state.selected) || null;
    }

    function makeNode(type) {
      idCounter += 1;
      return Object.assign({ id: "dd" + idCounter, type: type }, DEFAULTS, TYPES[type].config);
    }

    /* ------------------------------------------------------
       Toast
       ------------------------------------------------------ */
    const toast = $("#toast");
    let toastTimer;
    function notify(message) {
      toast.textContent = message;
      toast.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 2200);
    }

    /* ------------------------------------------------------
       Turning a node into a DropJS dropdown
       ------------------------------------------------------ */
    function slug(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "option";
    }

    // One option per line. A line with --- becomes a divider.
    function parseOptions(text) {
      return text.split("\n").map((line) => line.trim()).filter(Boolean).map((line) => {
        return line === "---" ? { divider: true } : { label: line, value: slug(line) };
      });
    }

    function styleOf(n) {
      return {
        accent: n.accent,
        bg: n.bg,
        text: n.text,
        radius: n.radius + "px",
        muted: "color-mix(in srgb, " + n.text + " 55%, " + n.bg + ")",
        border: "color-mix(in srgb, " + n.text + " 14%, " + n.bg + ")"
      };
    }

    function classOf(n) {
      return [n.ghost ? "dropjs--ghost" : "", n.wide ? "dropjs--wide" : ""].filter(Boolean).join(" ");
    }

    function buildConfig(n, host) {
      return {
        target: host,
        label: n.label,
        triggerHTML: n.avatar ? AVATAR_HTML : "",
        searchable: n.searchable,
        selectable: n.selectable,
        align: n.align,
        className: classOf(n),
        style: styleOf(n),
        placeholder: "Search…",
        options: parseOptions(n.options),
        onSelect: (option) => notify("Selected " + option.label)
      };
    }

    /* ------------------------------------------------------
       Rendering
       ------------------------------------------------------ */
    function renderCanvas() {
      Object.keys(instances).forEach((id) => instances[id].destroy());
      instances = {};
      nodesEl.innerHTML = "";

      state.nodes.forEach((n) => {
        const wrap = document.createElement("div");
        wrap.className = "node" + (n.id === state.selected ? " is-selected" : "");
        wrap.dataset.id = n.id;
        const host = document.createElement("div");
        wrap.appendChild(host);
        nodesEl.appendChild(wrap);
        instances[n.id] = new DropJS(buildConfig(n, host));
      });

      const hasNodes = state.nodes.length > 0;
      dropzone.classList.toggle("is-compact", hasNodes);
      $("#dropzone-text").textContent = hasNodes ? "Drop another dropdown here" : "Drop dropdowns here";
      $("#frame-title").textContent = nameInput.value || "Untitled project";
    }

    function renderTree() {
      treeEl.innerHTML = "";
      const root = document.createElement("div");
      root.className = "tree-root";
      root.textContent = nameInput.value || "Untitled project";
      treeEl.appendChild(root);

      if (!state.nodes.length) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.style.padding = "0.4rem 1.5rem";
        empty.textContent = "Nothing added yet.";
        treeEl.appendChild(empty);
        return;
      }

      state.nodes.forEach((n) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tree-item" + (n.id === state.selected ? " is-selected" : "");
        button.innerHTML = icon(TYPES[n.type].icon);
        const text = document.createElement("span");
        text.textContent = n.label;
        button.appendChild(text);
        button.addEventListener("click", () => select(n.id));
        treeEl.appendChild(button);
      });
    }

    function renderProps() {
      const n = current();
      if (!n) {
        propsEl.innerHTML = '<p class="muted">No component selected</p>';
        return;
      }

      propsEl.innerHTML =
        '<div class="field"><label for="p-label">Label</label><input id="p-label" type="text" maxlength="40"></div>' +
        '<div class="field"><label for="p-options">Options</label><textarea id="p-options" rows="6" spellcheck="false"></textarea>' +
        "<small>One per line. Use --- for a divider.</small></div>" +
        '<div class="field"><span class="flabel">Behavior</span>' +
        '<label class="check"><input type="checkbox" id="p-searchable"><span>Searchable</span></label>' +
        '<label class="check"><input type="checkbox" id="p-selectable"><span>Show chosen option</span></label></div>' +
        '<div class="field"><span class="flabel">Menu alignment</span><div class="seg" role="group" aria-label="Menu alignment">' +
        '<button type="button" data-align="left">Left</button><button type="button" data-align="right">Right</button></div></div>' +
        '<div class="field"><span class="flabel">Style</span>' +
        '<label class="color-row">Accent <input type="color" id="p-accent"></label>' +
        '<label class="color-row">Background <input type="color" id="p-bg"></label>' +
        '<label class="color-row">Text <input type="color" id="p-text"></label>' +
        '<label class="color-row" for="p-radius">Corner radius <output id="p-radius-out"></output></label>' +
        '<input type="range" id="p-radius" min="0" max="24" step="1"></div>' +
        '<button type="button" class="danger" id="p-delete">Delete component</button>';

      // Fill in the current values
      $("#p-label").value = n.label;
      $("#p-options").value = n.options;
      $("#p-searchable").checked = n.searchable;
      $("#p-accent").value = n.accent;
      $("#p-bg").value = n.bg;
      $("#p-text").value = n.text;
      $("#p-radius").value = n.radius;
      $("#p-radius-out").textContent = n.radius + "px";
      syncSelectable(n);
      syncAlign(n);

      // Listen for edits
      $("#p-label").addEventListener("input", (e) => patch({ label: e.target.value }, "label"));
      $("#p-options").addEventListener("input", (e) => patch({ options: e.target.value }, "options"));
      $("#p-searchable").addEventListener("change", (e) => {
        patch({ searchable: e.target.checked });
        syncSelectable(current());
      });
      $("#p-selectable").addEventListener("change", (e) => patch({ selectable: e.target.checked }));
      $$("[data-align]", propsEl).forEach((button) => {
        button.addEventListener("click", () => {
          patch({ align: button.dataset.align });
          syncAlign(current());
        });
      });
      ["accent", "bg", "text"].forEach((key) => {
        $("#p-" + key).addEventListener("input", (e) => patch({ [key]: e.target.value }, key));
      });
      $("#p-radius").addEventListener("input", (e) => {
        $("#p-radius-out").textContent = e.target.value + "px";
        patch({ radius: Number(e.target.value) }, "radius");
      });
      $("#p-delete").addEventListener("click", () => removeNode(n.id));
    }

    // A searchable dropdown always shows the chosen option
    function syncSelectable(n) {
      const box = $("#p-selectable");
      box.checked = n.searchable || n.selectable;
      box.disabled = n.searchable;
    }

    function syncAlign(n) {
      $$("[data-align]", propsEl).forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.align === n.align));
      });
    }

    function renderAll() {
      renderCanvas();
      renderTree();
      renderProps();
    }

    /* ------------------------------------------------------
       Editing: select, add, change, delete
       ------------------------------------------------------ */
    function select(id) {
      if (state.selected === id) return;
      state.selected = id;
      $$(".node").forEach((el) => el.classList.toggle("is-selected", el.dataset.id === id));
      renderTree();
      renderProps();
    }

    function addNode(type) {
      const node = makeNode(type);
      state.nodes.push(node);
      state.selected = node.id;
      renderAll();
      commit();
    }

    function patch(changes, key) {
      const n = current();
      if (!n) return;
      Object.assign(n, changes);
      renderCanvas();
      renderTree();
      commit(key);
    }

    function removeNode(id) {
      state.nodes = state.nodes.filter((n) => n.id !== id);
      state.selected = null;
      renderAll();
      commit();
    }

    /* ------------------------------------------------------
       Undo / redo (snapshots of the node list)
       ------------------------------------------------------ */
    const undoStack = [];
    let redoStack = [];
    let lastSnap = "";
    let lastKey = null;
    let lastTime = 0;

    const btnUndo = $("#btn-undo");
    const btnRedo = $("#btn-redo");

    function snapshot() {
      return JSON.stringify(state.nodes);
    }

    function updateHistoryButtons() {
      btnUndo.disabled = undoStack.length === 0;
      btnRedo.disabled = redoStack.length === 0;
    }

    // Call after every change. Rapid edits to the same field count as one step.
    function commit(key) {
      const snap = snapshot();
      if (snap === lastSnap) return;
      const sameBurst = key && key === lastKey && Date.now() - lastTime < 800;
      if (!sameBurst) undoStack.push(lastSnap);
      redoStack = [];
      lastSnap = snap;
      lastKey = key || null;
      lastTime = Date.now();
      updateHistoryButtons();
    }

    function restore(snap) {
      state.nodes = JSON.parse(snap);
      if (!state.nodes.some((n) => n.id === state.selected)) state.selected = null;
      lastKey = null;
      renderAll();
      updateHistoryButtons();
    }

    btnUndo.addEventListener("click", () => {
      if (!undoStack.length) return;
      redoStack.push(lastSnap);
      lastSnap = undoStack.pop();
      restore(lastSnap);
    });

    btnRedo.addEventListener("click", () => {
      if (!redoStack.length) return;
      undoStack.push(lastSnap);
      lastSnap = redoStack.pop();
      restore(lastSnap);
    });

    /* ------------------------------------------------------
       Left panel: component list, tabs, drag and drop
       ------------------------------------------------------ */
    const compList = $("#comp-list");
    Object.keys(TYPES).forEach((type) => {
      const t = TYPES[type];
      const el = document.createElement("div");
      el.className = "comp";
      el.draggable = true;
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", "Add " + t.name);
      el.innerHTML = icon(t.icon) + "<span>" + t.name + "</span>" + icon("grip", "grip");

      el.addEventListener("click", () => addNode(type));
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          addNode(type);
        }
      });
      el.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", type);
        e.dataTransfer.effectAllowed = "copy";
      });
      compList.appendChild(el);
    });

    canvas.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("is-over");
    });
    canvas.addEventListener("dragleave", (e) => {
      if (!canvas.contains(e.relatedTarget)) dropzone.classList.remove("is-over");
    });
    canvas.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("is-over");
      const type = e.dataTransfer.getData("text/plain");
      if (TYPES[type]) addNode(type);
    });

    // Clicking a dropdown selects it. Clicking empty canvas clears the selection.
    canvas.addEventListener("pointerdown", (e) => {
      const wrap = e.target.closest(".node");
      select(wrap ? wrap.dataset.id : null);
    });

    const tabComp = $("#tab-comp");
    const tabTree = $("#tab-tree");
    function showTab(which) {
      const isComp = which === "comp";
      tabComp.setAttribute("aria-selected", String(isComp));
      tabTree.setAttribute("aria-selected", String(!isComp));
      $("#panel-comp").hidden = !isComp;
      $("#panel-tree").hidden = isComp;
    }
    tabComp.addEventListener("click", () => showTab("comp"));
    tabTree.addEventListener("click", () => showTab("tree"));

    /* ------------------------------------------------------
       Top bar: project name, open, new, save, preview
       ------------------------------------------------------ */
    const STORAGE_KEY = "dropjs-studio-project";

    nameInput.addEventListener("input", () => {
      $("#frame-title").textContent = nameInput.value || "Untitled project";
      renderTree();
    });

    $("#btn-save").addEventListener("click", () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ name: nameInput.value, nodes: state.nodes }));
        notify("Saved in this browser");
      } catch (error) {
        notify("Could not save here (browser storage is blocked)");
      }
    });

    $("#btn-open").addEventListener("click", () => {
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch (error) {
        saved = null;
      }
      if (!saved || !Array.isArray(saved.nodes)) {
        notify("No saved project yet. Use Save first.");
        return;
      }
      nameInput.value = saved.name || "Untitled project";
      state.nodes = saved.nodes;
      state.selected = null;
      idCounter = state.nodes.reduce((max, n) => Math.max(max, parseInt(n.id.slice(2), 10) || 0), idCounter);
      renderAll();
      commit();
      notify("Opened “" + nameInput.value + "”");
    });

    $("#btn-new").addEventListener("click", () => {
      nameInput.value = "Untitled project";
      state.nodes = [];
      state.selected = null;
      renderAll();
      commit();
    });

    const btnPreview = $("#btn-preview");
    btnPreview.addEventListener("click", () => {
      const on = document.body.classList.toggle("is-preview");
      $("span", btnPreview).textContent = on ? "Edit" : "Preview";
      $("svg", btnPreview).innerHTML = ICONS[on ? "edit" : "eye"];
    });

    /* ------------------------------------------------------
       Generate: turn the canvas into copy-paste code
       ------------------------------------------------------ */
    function optionLine(o) {
      return o.divider
        ? "{ divider: true }"
        : "{ label: " + JSON.stringify(o.label) + ", value: " + JSON.stringify(o.value) + " }";
    }

    function nodeToJs(n) {
      const lines = [
        '  target: "#' + n.id + '"',
        "  label: " + JSON.stringify(n.label)
      ];
      if (n.avatar) lines.push("  triggerHTML: " + JSON.stringify(AVATAR_HTML));
      if (n.searchable) lines.push("  searchable: true");
      if (n.selectable && !n.searchable) lines.push("  selectable: true");
      if (n.align === "right") lines.push('  align: "right"');
      if (classOf(n)) lines.push("  className: " + JSON.stringify(classOf(n)));
      const style = styleOf(n);
      lines.push("  style: {\n" + Object.keys(style).map((k) => "    " + k + ": " + JSON.stringify(style[k])).join(",\n") + "\n  }");
      lines.push("  options: [\n" + parseOptions(n.options).map((o) => "    " + optionLine(o)).join(",\n") + "\n  ]");
      return "const " + n.id + " = new DropJS({\n" + lines.join(",\n") + "\n});";
    }

    function generateCode() {
      if (!state.nodes.length) return "// Add a component to the canvas first.";
      const markup = state.nodes.map((n) => '<div id="' + n.id + '"></div>').join("\n");
      return (
        '<link rel="stylesheet" href="style.css">\n\n' +
        markup +
        '\n\n<script src="dropjs.js"><\/script>\n<script>\n' +
        state.nodes.map(nodeToJs).join("\n\n") +
        "\n<\/script>"
      );
    }

    const dialog = $("#gen-dialog");
    const copyButton = $("#gen-copy");

    $("#btn-generate").addEventListener("click", () => {
      $("#gen-code").textContent = generateCode();
      copyButton.textContent = "Copy";
      dialog.showModal();
    });
    $("#gen-close").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", (e) => {
      if (e.target === dialog) dialog.close(); // click on the backdrop
    });

    copyButton.addEventListener("click", async () => {
      const text = $("#gen-code").textContent;
      try {
        await navigator.clipboard.writeText(text);
      } catch (error) {
        const area = document.createElement("textarea");
        area.value = text;
        dialog.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      copyButton.textContent = "Copied";
      setTimeout(() => { copyButton.textContent = "Copy"; }, 1500);
    });

    /* ------------------------------------------------------
       Start with two example dropdowns
       ------------------------------------------------------ */
    state.nodes = [makeNode("navigation"), makeNode("searchable")];
    renderAll();
    lastSnap = snapshot();
  })();
  </script>
</body>
</html>
